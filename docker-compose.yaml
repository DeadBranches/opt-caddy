name: caddy

x-account:
  account_name: svc-caddy
  id: 748
  user: &user "748:748"

services:
  caddy:
    container_name: caddy
    image: caddy
    build:  # Build caddy with porkbun plugin
      context: /opt/caddy/build
      dockerfile: Dockerfile
      args:
        CADDY_VER: "2.10"
    user: *user
    networks: 
      http_net:
        ipv4_address: 10.99.11.33
    extra_hosts:
      - "host.docker.internal:host-gateway" # Proxy to host-mode for HA
    hostname: caddy
    restart: on-failure
    env_file: 
      #- /srv/caddy/secrets/caddy-old.env
      - /srv/caddy/secrets/caddy.env
      # - /srv/caddy/secrets/caddy-breeze-atuin.env           # -> 8888
      - /srv/caddy/secrets/caddy-tornado-atuin.env            # -> 8888
      - /srv/caddy/secrets/caddy-breeze-bitwarden-mxroute.env # -> 6123
      #- /srv/caddy/secrets/caddy-breeze-home-assistant.env   # -> 8123
      - /srv/caddy/secrets/caddy-tornado-home-assistant.env   # -> 8123
      # - /srv/caddy/secrets/caddy-breeze-mailu.env
      - /srv/caddy/secrets/caddy-tornado-mailu.env            # -> 8088
      - /srv/caddy/secrets/caddy-breeze-ntfy.env              # -> 80
      - /srv/caddy/secrets/caddy-breeze-pihole.env            # -> 8443
      # - /srv/caddy/secrets/caddy-breeze-vaultwarden.env     # -> 80
      - /srv/caddy/secrets/caddy-tornado-vaultwarden.env      # -> 8215
      - /srv/caddy/secrets/caddy-cyclone-comfyui.env          # -> 1131
      # - /srv/caddy/secrets/caddy-cyclone-vllm_omni.env      # -> 1141
      - /srv/caddy/secrets/caddy-flurry-vllm_omni.env         # -> 1131
      - /srv/caddy/secrets/caddy-flurry-koboldcpp.env         # -> 1111
      - /srv/caddy/secrets/caddy-flurry-sillytavern.env       # -> 1121
    ports:
      - 80:80       # Needed for HTTP-01 challenge
      - 80:80/udp
      - 443:443
      - 443:443/udp # Needed for HTTP/3
    dns:
      - 192.168.1.40
    volumes:
      - "/opt/caddy/conf/etc-caddy:/etc/caddy"
      - "/srv/caddy/conf:/config/caddy"       # rename caddy_config -> config
      - "/srv/caddy/data/caddy:/data/caddy"   # rename caddy_data -> data
      - "/srv/caddy/data/certs:/certs:ro"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 2019"]
      start_period: 60s
      interval: 60s
      timeout: 5s
      retries: 3
    labels:
      STACK: caddy
      SERVICE: caddy
    logging:
      driver: syslog
      options:
        syslog-address: "udp://192.168.1.40:514"
        tag: "caddy"

networks:
  http_net:
    name: http_net
    external: true
