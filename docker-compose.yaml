name: caddy

x-account:
  account_name: svc-caddy
  id: 748
  user: &user "748:748"

x-resource-limits-caddy: &resource_limits_caddy
  cpus: 2.0
  mem_reservation: "40m"
  mem_limit: "64m"
  memswap_limit: "96m"
  pids_limit: 256

services:
  caddy:
    extends:
      file: /opt/.defaults/resource-limits.yaml
      service: blkio_defaults
    container_name: caddy
    image: caddy
    <<: [*resource_limits_caddy]
    build:  # Build caddy with porkbun plugin
      context: /opt/caddy/build
      dockerfile: Dockerfile
      args:
        CADDY_VER: "2.10"
    user: *user
    networks: 
      http_net:
        ipv4_address: 10.99.11.33
    extra_hosts:
      - "host.docker.internal:host-gateway" # Proxy to host-mode for HA
    hostname: caddy
    restart: unless-stopped
    env_file: 
      #- /srv/caddy/secrets/caddy-old.env
      - /srv/caddy/secrets/caddy.env
      - /srv/caddy/secrets/caddy-atuin.env
      - /srv/caddy/secrets/caddy-bitwarden-mxroute.env
      - /srv/caddy/secrets/caddy-home-assistant.env
      - /srv/caddy/secrets/caddy-mailu.env
      - /srv/caddy/secrets/caddy-ntfy.env
      - /srv/caddy/secrets/caddy-pihole.env
      - /srv/caddy/secrets/caddy-vaultwarden.env
    ports:
      - 80:80       # Needed for HTTP-01 challenge
      - 80:80/udp
      - 443:443
      - 443:443/udp # Needed for HTTP/3
    dns:
      - 192.168.1.40
    volumes:
      - "/opt/caddy/conf/etc-caddy:/etc/caddy"
      - "/srv/caddy/conf:/config/caddy"       # rename caddy_config -> config
      - "/srv/caddy/data/caddy:/data/caddy"   # rename caddy_data -> data
      - "/srv/caddy/data/certs:/certs:ro"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 2019"]
      start_period: 60s
      interval: 60s
      timeout: 5s
      retries: 3
    labels:
      STACK: caddy
      SERVICE: caddy

networks:
  http_net:
    name: http_net
    external: true
